<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Privado — Portal</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
  <!-- Carga de Google Material Symbols (Icons) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="dashboard-card">
    <div class="logo-container">
      <img src="./assets/img/logo.svg" alt="Logo ualvarez." class="brand-logo">
    </div>

    <h1>Área Exclusiva de Cliente</h1>
    <p style="color: var(--text-muted, #94a3b8); text-align: center;">
      Sesión iniciada como: <strong id="user-email" style="color: #38bdf8;">cargando...</strong>
    </p>

    <ul class="service-list">
      <li>
        <div class="service-item">
          <span class="material-symbols-outlined icon">language</span>
          <span>Desarrollo Web & SEO Local</span>
        </div>
        <span class="badge">En Producción</span>
      </li>
      <li>
        <div class="service-item">
          <span class="material-symbols-outlined icon">verified_user</span>
          <span>Certificado SSL & DNS</span>
        </div>
        <span class="badge active">Activo</span>
      </li>
      <li>
        <div class="service-item">
          <span class="material-symbols-outlined icon">cloud_done</span>
          <span>Mantenimiento Cloud</span>
        </div>
        <span class="badge active">Al día</span>
      </li>
    </ul>

    <div class="btn-group">
      <button class="danger" onclick="handleLogout()">
        <span class="material-symbols-outlined icon-btn">logout</span>
        Cerrar Sesión
      </button>
    </div>
  </main>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/dashboard.js"></script>
</body>
</html>

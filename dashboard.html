<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Privado — Portal</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">

  <!-- HEADER NAVEGACIÓN SUPERIOR -->
  <header class="dashboard-header">
    <div class="header-logo">
      <img src="./assets/img/logo.svg" alt="Logo ualvarez." class="brand-logo-sm">
    </div>

    <!-- Avatar y Menú de Usuario -->
    <div class="user-menu-container">
      <button id="user-avatar-btn" class="avatar-btn" onclick="toggleUserMenu()">
        <span class="material-symbols-outlined">account_circle</span>
      </button>

      <!-- Dropdown Flotante -->
      <div id="user-dropdown" class="user-dropdown hidden">
        <div class="dropdown-header">
          <p class="dropdown-user-name" id="dropdown-name">Cargando...</p>
          <p class="dropdown-user-email" id="dropdown-email">cargando@mail.com</p>
        </div>
        <hr class="dropdown-divider">
        <button class="dropdown-item" onclick="openProfileModal()">
          <span class="material-symbols-outlined">person</span>
          Mi Perfil
        </button>
        <button class="dropdown-item danger-text" onclick="handleLogout()">
          <span class="material-symbols-outlined">logout</span>
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

<!-- CONTENIDO PRINCIPAL: SERVICIOS -->
<main class="dashboard-card">
  <h1>Área Exclusiva de Cliente</h1>
  <p class="card-subtitle">
    Sesión iniciada como: <strong id="user-email" style="color: var(--accent);">cargando...</strong>
  </p>

  <!-- Lista dinámica conectada a Supabase -->
<ul class="service-list" id="service-container">
  <!-- Tarjetas Skeleton animadas mientras carga -->
  <li class="skeleton-item"></li>
  <li class="skeleton-item"></li>
  <li class="skeleton-item"></li>
</ul>
</main>
  <!-- MODAL DE PERFIL (Flotante) -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Gestionar Perfil</h3>
        <button class="modal-close" onclick="closeProfileModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label for="update-fullname">Nombre / Empresa</label>
          <input type="text" id="update-fullname" placeholder="Tu nombre o empresa" />
        </div>

        <div class="modal-actions">
          <button onclick="handleUpdateProfile()" class="btn-primary">
            <span class="material-symbols-outlined icon-btn">save</span>
            Guardar Nombre
          </button>
          <button onclick="handleResetPassword()" class="btn-secondary">
            <span class="material-symbols-outlined icon-btn">lock_reset</span>
            Restablecer Clave
          </button>
        </div>

        <div id="profile-message" class="message"></div>
      </div>
    </div>
  </div>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/dashboard.js"></script>

  <!-- MODAL DE DETALLE DEL SERVICIO -->
<div id="service-detail-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="material-symbols-outlined icon" id="modal-service-icon" style="color: var(--accent);">language</span>
        <h3 id="modal-service-title">Cargando...</h3>
      </div>
      <button onclick="closeServiceModal()" class="btn-close">&times;</button>
    </div>
    
    <div class="modal-body" style="margin-top: 15px;">
      <p style="margin-bottom: 12px; color: var(--text-muted);">
        Estado actual: <strong id="modal-service-status" class="badge">--</strong>
      </p>
      
      <div style="background: rgba(255, 255, 255, 0.03); padding: 14px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px;">
        <h4 style="margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Descripción & Alcance</h4>
        <p id="modal-service-desc" style="font-size: 0.95rem; line-height: 1.5; color: var(--text-main);">
          --
        </p>
      </div>

      <!-- Enlace externo (si existe link de demo o producción) -->
      <div id="modal-service-link-container" class="hidden" style="margin-bottom: 15px;">
        <a id="modal-service-link" href="#" target="_blank" rel="noopener noreferrer" style="color: var(--accent); text-decoration: underline; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 4px;">
          <span class="material-symbols-outlined" style="font-size: 1.1rem;">open_in_new</span>
          Ver proyecto en producción
        </a>
      </div>

      <!-- Acceso directo a Soporte / Tickets -->
      <button onclick="openTicketFromService()" class="btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;">
        <span class="material-symbols-outlined">support_agent</span>
        Solicitar Soporte sobre este servicio
      </button>
    </div>
  </div>
</div>

<!-- MODAL DE CREACIÓN DE TICKET -->
<div id="ticket-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="material-symbols-outlined icon" style="color: var(--accent);">confirmation_number</span>
        <h3>Solicitar Soporte Técnico</h3>
      </div>
      <button onclick="closeTicketModal()" class="btn-close">&times;</button>
    </div>
    
    <form id="ticket-form" onsubmit="handleCreateTicket(event)" class="modal-body" style="margin-top: 15px;">
      <div style="margin-bottom: 12px;">
        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Servicio Afectado</label>
        <select id="ticket-service-id" class="input-field" style="width: 100%; background: #1a1a1a; color: white; padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
          <option value="">-- General / Consulta global --</option>
        </select>
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Asunto</label>
        <input type="text" id="ticket-subject" placeholder="Ej: Error al acceder al dominio" required class="input-field" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #1a1a1a; color: white;">
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Prioridad</label>
        <select id="ticket-priority" class="input-field" style="width: 100%; background: #1a1a1a; color: white; padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
          <option value="Baja">Baja</option>
          <option value="Media" selected>Media</option>
          <option value="Alta">Alta</option>
        </select>
      </div>

      <div style="margin-bottom: 15px;">
        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Detalle de la consulta</label>
        <textarea id="ticket-message" rows="4" placeholder="Describí tu inconveniente o consulta..." required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #1a1a1a; color: white; resize: vertical;"></textarea>
      </div>

      <div id="ticket-response-msg" style="margin-bottom: 10px; font-size: 0.85rem;"></div>

      <button type="submit" id="btn-submit-ticket" class="btn-primary" style="width: 100%;">
        Enviar Ticket
      </button>
    </form>
  </div>
</div>
<!-- SECCIÓN DE HISTORIAL DE TICKETS -->
<section style="margin-top: 30px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
    <h3 style="font-size: 1.1rem; font-weight: 500;">Historial de Soporte</h3>
    <button onclick="openTicketModal()" class="btn-primary" style="font-size: 0.85rem; padding: 6px 12px; display: flex; align-items: center; gap: 4px;">
      <span class="material-symbols-outlined" style="font-size: 1rem;">add</span>
      Nuevo Ticket
    </button>
  </div>

  <ul class="service-list" id="tickets-container">
    <li class="skeleton-item"></li>
  </ul>
</section>
</body>
</html>
